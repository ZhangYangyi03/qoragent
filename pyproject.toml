[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qoragent"
version = "0.1.0"
description = "QoR search over synthesis passes, gated by proven logical equivalence"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Zhang Yangyi", email = "2936745@qq.com"}]
keywords = ["synthesis", "qor", "eda", "formal-equivalence", "yosys", "rtl"]
classifiers = [
  "Topic::Scientific/Engineering::Electronic Design Automation (EDA)",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/ZhangYangyi03/qoragent"

[tool.setuptools]
packages = ["qoragent"]
